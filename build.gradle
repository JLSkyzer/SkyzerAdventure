plugins {
    id 'eclipse'
    id 'net.neoforged.moddev.legacyforge' version '2.0.103'
}

version = '1.0'
base.archivesName = "skyzeradventure"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "1.18.2-40.3.11"

    runs {
        client {
            client()

            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        mcreator {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}


mixin {
    add sourceSets.main, "skyzeradventure.refmap.json"
    config "skyzeradventure.mixins.json"
}

dependencies {
    // Annotations/processor seulement
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))

    // Charger à l’exécution la variante Forge (pas NeoForge)
    runtimeOnly("io.github.llamalad7:mixinextras-forge:0.5.0")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest.attributes([
        "MixinConfigs": "skyzeradventure.mixins.json"
    ])
}

configurations.all {
    exclude group: "io.github.llamalad7", module: "mixinextras-neoforge"
    resolutionStrategy {
        eachDependency { details ->
            if (details.requested.group == "io.github.llamalad7" &&
                    details.requested.name == "mixinextras-neoforge") {
                details.useTarget "io.github.llamalad7:mixinextras-forge:0.5.0"
                details.because "Évite le double export JPMS (forge + neoforge) → crash."
            }
        }
        force "io.github.llamalad7:mixinextras-forge:0.5.0"
    }
}


apply from: 'mcreator.gradle'
