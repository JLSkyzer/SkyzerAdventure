plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0'
group = 'com.yourname.modid'
base.archivesName = "modid"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

base {
    archivesName = mod_id
}

minecraft {
    mappings channel: 'official', version: '1.18.2'
    version = "1.18.2"
    forge = "40.2.17"
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file("run")
            source sourceSets.main

            args "--username", "Dev"
            if (System.getenv("MCREATOR_JVM_OPTIONS")) {
                System.getenv("MCREATOR_JVM_OPTIONS").split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }

            mods {
                "modid" { source sourceSets.main }
            }

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }

        server {
            workingDirectory project.file("run")
            source sourceSets.main

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = "https://maven.terraformersmc.com/" } // Pour mixinextras
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}


mixin {
    add sourceSets.main, "skyzeradventure.refmap.json"
    config "skyzeradventure.mixins.json"
}

dependencies {
    // Forge (obligatoire)
    minecraft "net.minecraftforge:forge:1.18.2-40.2.17"

    //implementation(jarJar("io.github.llamalad7:mixinextras-neoforge:0.4.1"))
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1")) {
        jarJar.ranged(it, "[0.4.1,)")
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest.attributes([
        "MixinConfigs": "skyzeradventure.mixins.json"
    ])
    finalizedBy 'reobfJar'
}

apply from: 'mcreator.gradle'
